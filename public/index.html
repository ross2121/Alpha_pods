<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alpha Pods Governance Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #050816;
        color: #e5e7eb;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-mark {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        flex: 0 0 auto;
      }
      .logo-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .logo-title {
        font-weight: 700;
        font-size: 18px;
        line-height: 1.1;
      }
      .logo-subtitle {
        font-size: 11px;
        color: #94a3b8;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .pill {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #7dd3fc;
      }
      main {
        display: grid;
        grid-template-columns: 280px 1fr 320px;
        gap: 16px;
        padding: 16px 24px 32px;
        box-sizing: border-box;
      }
      @media (max-width: 1024px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: radial-gradient(circle at top left, #0f172a, #020617);
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        padding: 14px 14px 10px;
        box-sizing: border-box;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      .realm-list {
        max-height: 70vh;
        overflow-y: auto;
      }
      .realm-item {
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 6px;
        transition: background 0.15s, border-color 0.15s;
        border: 1px solid transparent;
      }
      .realm-item:hover {
        background: rgba(30, 64, 175, 0.3);
        border-color: rgba(59, 130, 246, 0.5);
      }
      .realm-item.active {
        background: rgba(30, 64, 175, 0.7);
        border-color: rgba(96, 165, 250, 0.9);
      }
      .realm-name {
        font-size: 13px;
        font-weight: 600;
      }
      .realm-sub {
        font-size: 11px;
        color: #9ca3af;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        background: rgba(31, 41, 55, 0.9);
        color: #9ca3af;
        margin-right: 4px;
      }
      .tag-pill {
        background: rgba(22, 101, 52, 0.3);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.5);
      }
      .proposal-list {
        max-height: 60vh;
        overflow-y: auto;
      }
      .proposal-item {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(31, 41, 55, 0.9);
        margin-bottom: 8px;
      }
      .proposal-title {
        font-size: 13px;
        font-weight: 600;
      }
      .proposal-meta {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 4px;
      }
      .status-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        margin-right: 4px;
      }
      .status-Draft {
        background: rgba(31, 41, 55, 0.9);
        color: #9ca3af;
      }
      .status-Voting {
        background: rgba(30, 64, 175, 0.6);
        color: #bfdbfe;
      }
      .status-Succeeded {
        background: rgba(22, 101, 52, 0.6);
        color: #bbf7d0;
      }
      .status-Executed {
        background: rgba(22, 163, 74, 0.7);
        color: #dcfce7;
      }
      .status-Defeated,
      .status-Cancelled {
        background: rgba(127, 29, 29, 0.7);
        color: #fecaca;
      }
      .delegate-list {
        max-height: 60vh;
        overflow-y: auto;
      }
      .delegate-item {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(31, 41, 55, 0.9);
        margin-bottom: 6px;
      }
      .delegate-name {
        font-size: 13px;
        font-weight: 600;
      }
      .delegate-meta {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 2px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 11px;
      }
      a {
        color: #93c5fd;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .empty {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <img class="logo-mark" src="/logo.svg" alt="AlphaPods logo" />
        <div class="logo-copy">
          <div class="logo-title">AlphaPods</div>
          <div class="logo-subtitle">Governance Dashboard</div>
        </div>
      </div>
      <div class="pill">Read‑only dashboard · Data from Postgres</div>
    </header>
    <main>
      <section class="card">
        <h2>Realms</h2>
        <div id="realms" class="realm-list">
          <div class="empty">Loading realms…</div>
        </div>
      </section>
      <section class="card">
        <h2>Proposals</h2>
        <div id="proposals" class="proposal-list">
          <div class="empty">Select a realm on the left.</div>
        </div>
      </section>
      <section class="card">
        <h2>Delegates</h2>
        <div id="delegates" class="delegate-list">
          <div class="empty">Select a realm to see delegates.</div>
        </div>
      </section>
    </main>

    <script>
      const realmsEl = document.getElementById("realms");
      const proposalsEl = document.getElementById("proposals");
      const delegatesEl = document.getElementById("delegates");

      let realms = [];
      let activeRealmPubkey = null;

      function shortPk(pk) {
        if (!pk) return "";
        return pk.slice(0, 4) + "…" + pk.slice(-4);
      }

      function formatDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString();
      }

      async function fetchJSON(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      async function loadRealms() {
        try {
          realmsEl.innerHTML = '<div class="empty">Loading realms…</div>';
          realms = await fetchJSON("/api/realms");
          if (!realms.length) {
            realmsEl.innerHTML =
              '<div class="empty">No realms in DB yet. Create one via /createdao or wait for indexer.</div>';
            return;
          }

          realmsEl.innerHTML = "";
          realms.forEach((realm) => {
            const div = document.createElement("div");
            div.className = "realm-item";
            div.dataset.pubkey = realm.pubkey;
            div.innerHTML =
              '<div class="realm-name">' +
              realm.name +
              "</div>" +
              '<div class="realm-sub"><span class="tag">' +
              realm.cluster +
              "</span><code>" +
              shortPk(realm.pubkey) +
              "</code></div>";
            div.onclick = () => selectRealm(realm.pubkey);
            realmsEl.appendChild(div);
          });
        } catch (e) {
          console.error(e);
          realmsEl.innerHTML =
            '<div class="empty">Failed to load realms. Check backend logs.</div>';
        }
      }

      async function selectRealm(pubkey) {
        activeRealmPubkey = pubkey;
        document
          .querySelectorAll(".realm-item")
          .forEach((el) => el.classList.remove("active"));
        const active = document.querySelector(
          '.realm-item[data-pubkey="' + pubkey + '"]'
        );
        if (active) active.classList.add("active");

        loadProposals(pubkey);
        loadDelegates(pubkey);
      }

      async function loadProposals(pubkey) {
        proposalsEl.innerHTML = '<div class="empty">Loading proposals…</div>';
        try {
          const { realm, proposals } = await fetchJSON(
            "/api/realms/" + pubkey + "/proposals"
          );
          if (!proposals.length) {
            proposalsEl.innerHTML =
              '<div class="empty">No proposals indexed yet for this realm.</div>';
            return;
          }
          proposalsEl.innerHTML = "";
          proposals.forEach((p) => {
            const div = document.createElement("div");
            div.className = "proposal-item";
            const stateClass = "status-" + (p.state || "Draft");
            div.innerHTML =
              '<div class="proposal-title">' +
              p.title +
              "</div>" +
              '<div class="proposal-meta">' +
              '<span class="status-pill ' +
              stateClass +
              '">' +
              p.state +
              "</span>" +
              "<code>" +
              shortPk(p.proposal_pubkey) +
              "</code>" +
              "</div>" +
              '<div class="proposal-meta">Voting window: ' +
              (p.voting_start ? formatDate(p.voting_start) : "–") +
              " → " +
              (p.voting_end ? formatDate(p.voting_end) : "–") +
              "</div>";
            proposalsEl.appendChild(div);
          });
        } catch (e) {
          console.error(e);
          proposalsEl.innerHTML =
            '<div class="empty">Failed to load proposals. Check backend logs.</div>';
        }
      }

      async function loadDelegates(pubkey) {
        delegatesEl.innerHTML = '<div class="empty">Loading delegates…</div>';
        try {
          const { delegates } = await fetchJSON(
            "/api/realms/" + pubkey + "/delegates"
          );
          if (!delegates.length) {
            delegatesEl.innerHTML =
              '<div class="empty">No delegates indexed yet for this realm.</div>';
            return;
          }
          delegatesEl.innerHTML = "";
          delegates.forEach((entry) => {
            const d = entry.delegate;
            const stats = entry;
            const div = document.createElement("div");
            div.className = "delegate-item";
            const participation =
              stats.participation_rate != null
                ? (stats.participation_rate * 100).toFixed(1) + "%"
                : "n/a";
            div.innerHTML =
              '<div class="delegate-name">' +
              (d.display_name || shortPk(d.wallet_pubkey)) +
              "</div>" +
              '<div class="delegate-meta"><code>' +
              shortPk(d.wallet_pubkey) +
              "</code></div>" +
              '<div class="delegate-meta">Total votes: ' +
              stats.total_votes +
              " · Participation: " +
              participation +
              "</div>";
            delegatesEl.appendChild(div);
          });
        } catch (e) {
          console.error(e);
          delegatesEl.innerHTML =
            '<div class="empty">Failed to load delegates. Check backend logs.</div>';
        }
      }

      loadRealms();
    </script>
  </body>
  </html>
